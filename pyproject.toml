[project]
name = "ai-montage-agent"
version = "0.1.0"
description = "AI Automatic Film Montage Agent - AI自动影视混剪Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Montage Team"}
]

dependencies = [
    # Video Processing
    "ffmpeg-python>=0.2.0",
    "scenedetect[opencv]>=0.6.2",
    "opencv-python>=4.8.0",

    # Audio Analysis
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "madmom>=0.16.1",

    # AI/ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "open-clip-torch>=2.20.0",

    # Backend
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "celery[redis]>=5.3.0",
    "redis>=4.6.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",

    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["var", "artifacts", "cache", "output", ".git", "__pycache__"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
